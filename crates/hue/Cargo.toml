[package]
name = "hue"
version = "0.1.0"

edition.workspace = true
authors.workspace = true
rust-version.workspace = true
description.workspace = true
readme.workspace = true
repository.workspace = true
license.workspace = true
categories.workspace = true
keywords.workspace = true

[lints]
workspace = true

[dependencies]
bitflags = "2.13.2"
byteorder = "1.5.0"
chrono = { version = "0.4.45", default-features = false, features = [
    "clock",
    "serde",
    "std",
] }
hex = "0.4.3"
iana-time-zone = "0.1.65"
packed_struct = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
siphasher = "1.0.4"
thiserror = "2.0.21"
uuid = { version = "1.29.2", features = ["serde", "v4", "v5"] }

mac_address = { version = "1.2.1", features = ["serde"], optional = true }
maplit = "1.0.2"

[features]
default = ["event", "mac", "rng"]

rng = ["uuid/v4"]
event = []
mac = ["dep:mac_address"]

[dev-dependencies]
hex = "0.4.3"
