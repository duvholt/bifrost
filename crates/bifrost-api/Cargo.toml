[package]
name = "bifrost-api"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
description.workspace = true
readme.workspace = true
repository.workspace = true
license.workspace = true
categories.workspace = true
keywords.workspace = true

[lints]
workspace = true

[dependencies]
camino = { version = "1.2.6", features = ["serde1"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.29.2", features = ["serde"] }
serde_json = "1.0.154"

hue = { version = "0.1.0", path = "../hue", default-features = false, features = ["event"] }
svc = { version = "0.1.0", path = "../svc", default-features = false }

mac_address = { version = "1.2.1", optional = true }
tokio = { version = "1.54.1", default-features = false, features = ["sync"] }

[features]
default = []

mac = ["dep:mac_address"]
