[package]
name = "svc"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
description.workspace = true
readme.workspace = true
repository.workspace = true
license.workspace = true
categories.workspace = true
keywords.workspace = true

[dependencies]
async-trait = "0.1.92"
futures = { version = "0.3.34", default-features = false, features = ["alloc"] }
log = { version = "0.4.35", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time", "tokio-macros"], optional = true }
uuid = { version = "1.29.2", features = [] }

[features]
default = ["manager"]

manager = ["dep:log", "dep:tokio", "uuid/v4"]

[lints]
workspace = true

[dev-dependencies]
pretty_env_logger = "0.5.0"
