[package]
name = "bifrost"
version = "0.1.0"

edition.workspace = true
authors.workspace = true
rust-version.workspace = true
description.workspace = true
readme.workspace = true
repository.workspace = true
license.workspace = true
categories.workspace = true
keywords.workspace = true

[workspace.package]
edition = "2024"
authors = [
    "Christian Iversen <ci@iversenit.dk>",
    "Christian Duvholt <christian@duvholt.net>",
]
rust-version = "1.89"
description = "A Philips Hue bridge emulator backed by zigbee2mqtt"
readme = "README.md"
repository = "https://github.com/duvholt/bifrost"
license = "GPL-3.0-only"
categories = ["api-bindings", "simulation", "network-programming"]
keywords = [
    "home-automation",
    "hue-lights",
    "hue-bridge",
    "home-assistant",
    "hue",
    "zigbee",
    "hue-api",
    "zigbee2mqtt",
    "phillips-hue",
]

[workspace]
members = [
    "crates/bifrost-api",
    "crates/hue",
    "crates/svc",
    "crates/z2m",
    "crates/memory2mqtt",
    "crates/zcl",
]

[workspace.lints.rust]
# NOTE: to use llvm-cov, comment out the "unstable_features" restriction:
unstable_features = "forbid"
unused_lifetimes = "warn"
unused_qualifications = "warn"

# Needed for llvm-cov
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly)'] }

[workspace.lints.clippy]
all         = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic    = { level = "warn", priority = -1 }
cargo       = { level = "warn", priority = -1 }
nursery     = { level = "warn", priority = -1 }
perf        = { level = "warn", priority = -1 }
style       = { level = "warn", priority = -1 }

multiple_crate_versions = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"

[lints]
workspace = true

[features]
default = [
    "server-banner",
]

server-banner = ["dep:termcolor"]

[profile.dev]
debug = "limited"
split-debuginfo = "unpacked"

[dependencies]
axum = { version = "0.8.9", features = ["json", "tokio", "macros", "multipart", "ws", "tracing"], default-features = false }
axum-core = "0.5.6"
axum-server = { version = "0.9.2", features = ["tls-openssl"], default-features = false }
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["clock", "serde"], default-features = false }
config = { version = "0.15.27", default-features = false, features = ["yaml"] }
futures = "0.3.34"
hyper = "1.12.0"
iana-time-zone = "0.1.65"
log = "0.4.35"
mac_address = { version = "1.2.1", features = ["serde"] }
mdns-sd = "0.21.7"
mime = "0.3.18"
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"], default-features = false }
serde_json = "1.0.154"
yaml_serde = "0.10.7"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "process", "rt-multi-thread", "signal"], default-features = false }
tokio-stream = { version = "0.1.19", features = ["sync"], default-features = false }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "normalize-path", "trace"], default-features = false }
tracing = "0.1.44"
uuid = { version = "1.29.2", features = ["serde", "v4", "v5"] }
pretty_env_logger = "0.5.0"
camino = { version = "1.2.6", features = ["serde1"] }
x509-cert = { version = "0.3.0", features = ["builder", "hazmat", "pem"], default-features = false }
sha2 = { version = "0.11.1", features = ["oid"] }
p256 = "0.14.0"
ecdsa = { version = "0.17.0", features = ["der"] }
der = { version = "0.8.3", features = ["oid"] }
sha1 = "0.11.0"
termcolor = { version = "1.4.1", optional = true }
itertools = "0.15.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "stream"] }
url = { version = "2.5.8", features = ["serde"] }
hex = "0.4.3"
async-trait = "0.1.92"
hue = { version = "0.1.0", path = "crates/hue" }
zcl = { path = "crates/zcl" }
openssl = "0.10.82"
tokio-util = { version = "0.7.20", features = ["net"] }
tokio-openssl = "0.6.5"
maplit = "1.0.2"
svc = { version = "0.1.0", path = "crates/svc" }
z2m = { version = "0.1.0", path = "crates/z2m" }
memory2mqtt = { version = "0.1.0", path = "crates/memory2mqtt" }
quick-xml = { version = "0.42.0", features = ["serialize"] }
tokio-ssdp = { git = "https://github.com/chrivers/tokio-ssdp.git", rev = "00fc29c3" }
udp-stream = { git = "https://github.com/chrivers/udp-stream.git", rev = "da6c76bb" }
native-tls = "0.2.18"
tokio-native-tls = "0.3.1"
tzfile = "0.1.3"
bifrost-api = { version = "0.1.0", path = "crates/bifrost-api", features = ["mac"] }
nix = { version = "0.32.0", default-features = false, features = ["socket"] }
rustls-pki-types = "1.16.0"

[dev-dependencies]
clap = { version = "4.6", features = ["derive"] }
clap-stdin = "1.0.0"
tokio = { version = "1.54.1", features = ["io-std"], default-features = false }
json_diff_ng = { version = "0.6.0", default-features = false }
packed_struct = "0.12.0"
eventsource-stream = "0.2.3"
pretty_assertions = "1.4.1"
